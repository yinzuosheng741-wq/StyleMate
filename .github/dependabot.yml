version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      agent-runtime:
        patterns:
          - langchain*
          - langgraph*
          - openai
          - pydantic
      desktop-runtime:
        patterns:
          - PySide6*
          - shiboken6
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
